; =====================================================================
;  ESP32-S3 墨水屏主板 v2.0 - PlatformIO 工程模板
;  模组: ESP32-S3-WROOM-1-N16R8 (16MB Flash + 8MB OPI PSRAM)
;  详见 ../PLATFORMIO.md
; =====================================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---------- 存储 / PSRAM 配置（N16R8 必须显式指定） ----------
board_build.mcu                    = esp32s3
board_build.flash_size             = 16MB
board_build.flash_mode             = qio
board_build.arduino.memory_type    = qio_opi      ; QIO Flash + OPI PSRAM (R8)
board_build.partitions             = default_16MB.csv
board_upload.flash_size            = 16MB
board_upload.maximum_size          = 16777216
board_build.f_cpu                  = 240000000L

; ---------- 原生 USB（GPIO19/20，无外置 USB-TTL）----------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; 串口监视走 USB CDC
    -DBOARD_HAS_PSRAM               ; 启用 PSRAM（墨水屏大缓存用）
    -DCORE_DEBUG_LEVEL=1
    ; 墨水屏调试输出的开关在 include/epd_debug.h（ENABLE_EPD_DEBUG：0=关闭 1=开启）；
    ; 想在这里统一覆盖就打开下一行，效果与改头文件相同：
    ; -DENABLE_EPD_DEBUG=1
    ; 面板默认 GDEY042T81（4.2" 400x300）；换 GDEM102T91（10.2" 960x640）打开下一行：
    ; -DEPD_PANEL_GDEM102T91=1

; ---------- 串口 / 上传 ----------
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder
upload_speed     = 921600
; 不要写 upload_port = auto：esptool v5 不再接受字面量 "auto"，会当成名为 auto 的串口
; 而报 FileNotFoundError。留空让 PlatformIO 自动探测；也可写死成实际端口，例如 COM4。
; upload_port    = COM4

; ---------- 依赖库（按需打开，首次会联网下载）----------
; WS2812 单颗灯珠（LED1）：库会自动用 RMT 驱动，比 bit-bang 稳定
; 墨水屏（ENABLE_EPD_DEBUG=1 时用到）：
;   GxEPD2 已内置 GDEY042T81 与 GDEM102T91 两块面板的驱动，不需要官方例程移植；
;   它依赖 Adafruit GFX Library，中文标签由 U8g2_for_Adafruit_GFX 提供。
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
