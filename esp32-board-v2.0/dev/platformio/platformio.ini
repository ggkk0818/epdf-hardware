; =====================================================================
;  ESP32-S3 墨水屏主板 v2.0 - PlatformIO 工程模板
;  模组: ESP32-S3-WROOM-1-N16R8 (16MB Flash + 8MB OPI PSRAM)
;  详见 ../PLATFORMIO.md
; =====================================================================
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---------- 存储 / PSRAM 配置（N16R8 必须显式指定） ----------
board_build.mcu                    = esp32s3
board_build.flash_size             = 16MB
board_build.flash_mode             = qio
board_build.arduino.memory_type    = qio_opi      ; QIO Flash + OPI PSRAM (R8)
board_build.partitions             = default_16MB.csv
board_upload.flash_size            = 16MB
board_upload.maximum_size          = 16777216
board_build.f_cpu                  = 240000000L

; ---------- 原生 USB（GPIO19/20，无外置 USB-TTL）----------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1     ; 串口监视走 USB CDC
    -DBOARD_HAS_PSRAM               ; 启用 PSRAM（墨水屏大缓存用）
    -DCORE_DEBUG_LEVEL=1

; ---------- 串口 / 上传 ----------
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder
upload_speed     = 921600
upload_port      = auto

; ---------- 依赖库（按需打开，首次会联网下载）----------
; WS2812 单颗灯珠（LED1）：库会自动用 RMT 驱动，比 bit-bang 稳定
; lib_deps =
;     adafruit/Adafruit NeoPixel@^1.12.0
; 墨水屏请使用 Good Display GDEM102T91 官方例程移植（见 ../EPD_INTERFACE.md）：
;     file://lib/gdem102t91        ; 把官方驱动放进来，用本地路径引用
